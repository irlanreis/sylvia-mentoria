    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentoria NEAP</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
        const prefix = ["https://pay.hub.la"];

        function getParams() {
            const url = new URL(window.top.location.href);
            let paramsString = "";

            if (url) {
                const utmSource = url.searchParams.get("utm_source") || "";
                const utmMedium = url.searchParams.get("utm_medium") || "";
                const utmCampaign = url.searchParams.get("utm_campaign") || "";
                const utmTerm = url.searchParams.get("utm_term") || "";
                const utmContent = url.searchParams.get("utm_content") || "";
                const fbclid = url.searchParams.get("fbclid") || "";

                if (url.search) {
                    paramsString = `&sck=${utmSource}|${utmMedium}|${utmCampaign}|${utmTerm}|${utmContent}`;
                }
                console.log(paramsString);
            }

            return paramsString;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        function updateLinks() {
            const urlParams = new URLSearchParams(window.location.search);
            const leadUserIndex = getCookie("LeadUserIndex") || sessionStorage.getItem("LeadUserIndex");

            if (leadUserIndex) {
                urlParams.append("src", leadUserIndex);

                document.querySelectorAll("a").forEach(function (link) {
                    for (const p of prefix) {
                        if (link.href.includes(p)) {
                            const separator = link.href.includes("?") ? "&" : "?";
                            link.href += separator + urlParams.toString() + getParams();
                        }
                    }
                });
            } else {
                // Tenta novamente após 100ms se o LeadUserIndex ainda não estiver presente
                setTimeout(updateLinks, 100);
            }
        }

        window.addEventListener('load', updateLinks);
    </script>
</body>

</html>
